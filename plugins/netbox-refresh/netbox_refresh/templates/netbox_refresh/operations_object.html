{% extends 'generic/object.html' %}
{% load helpers %}
{% block content %}
<div class="card"><h5 class="card-header">{{ object }}</h5>
<table class="table table-hover attr-table">
<tr><th>Device</th><td>{{ object.device|linkify }}</td></tr>
{% for label, value in rows %}<tr><th>{{ label|capfirst }}</th><td style="white-space: pre-wrap; overflow-wrap: anywhere">{{ value|default_if_none:'—' }}</td></tr>{% endfor %}
</table></div>
{% endblock %}
