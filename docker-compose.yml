# NetBox 4.7 with the Lifecycle plugin. Based on netbox-docker 5.1.1's
# docker-compose.yml; the NetBox image is built from ./Dockerfile.
#
# Project settings (name, image tag, published address) come from .env; NetBox,
# PostgreSQL and Valkey settings come from env/*.env. See README.md.
x-netbox: &netbox
  image: netbox-lifecycle:${NETBOX_VERSION:-v4.7.4-5.1.1}-${LIFECYCLE_VERSION:-0.5.0}
  env_file: env/netbox.env
  user: "netbox:root"
  volumes:
    - ./configuration:/etc/netbox/config:z,ro
    - netbox-media-files:/opt/netbox/netbox/media:rw
    - netbox-reports-files:/opt/netbox/netbox/reports:rw
    - netbox-scripts-files:/opt/netbox/netbox/scripts:rw
  restart: unless-stopped

services:
  netbox:
    <<: *netbox
    build:
      context: .
      args:
        NETBOX_IMAGE: docker.io/netboxcommunity/netbox:${NETBOX_VERSION:-v4.7.4-5.1.1}
    depends_on:
      - postgres
      - redis
      - redis-cache
    ports:
      # Behind the SSO Apache on another host, set BIND_ADDRESS in .env to this
      # host's private address and allow port 8080 from the Apache server only.
      - "${BIND_ADDRESS:-127.0.0.1}:${NETBOX_PORT:-8080}:8080"
    healthcheck:
      # netbox-docker's health.sh probes /login/, which 404s under BASE_PATH.
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/$${BASE_PATH:-}login/ >/dev/null || exit 1"]
      start_period: 300s
      timeout: 3s
      interval: 15s
  netbox-worker:
    <<: *netbox
    depends_on:
      netbox:
        condition: service_healthy
    command:
      - /opt/netbox/venv/bin/python
      - /opt/netbox/netbox/manage.py
      - rqworker
    healthcheck:
      test: ps -aux | grep -v grep | grep -q rqworker || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s

  postgres:
    image: docker.io/postgres:18-alpine
    healthcheck:
      test: pg_isready -q -t 2 -d $$POSTGRES_DB -U $$POSTGRES_USER
      start_period: 20s
      timeout: 30s
      interval: 10s
      retries: 5
    env_file: env/postgres.env
    volumes:
      - netbox-postgres:/var/lib/postgresql
    restart: unless-stopped

  redis:
    image: docker.io/valkey/valkey:9.1-alpine
    command:
      - sh
      - -c # evaluate $REDIS_PASSWORD from the env file
      - valkey-server --appendonly yes --requirepass $$REDIS_PASSWORD
    healthcheck: &redis-healthcheck
      test: '[ $$(valkey-cli --pass "$${REDIS_PASSWORD}" ping) = ''PONG'' ]'
      start_period: 5s
      timeout: 3s
      interval: 1s
      retries: 5
    env_file: env/redis.env
    volumes:
      - netbox-redis-data:/data
    restart: unless-stopped
  redis-cache:
    image: docker.io/valkey/valkey:9.1-alpine
    command:
      - sh
      - -c # evaluate $REDIS_PASSWORD from the env file
      - valkey-server --requirepass $$REDIS_PASSWORD
    healthcheck: *redis-healthcheck
    env_file: env/redis-cache.env
    volumes:
      - netbox-redis-cache-data:/data
    restart: unless-stopped

volumes:
  netbox-media-files:
  netbox-postgres:
  netbox-redis-cache-data:
  netbox-redis-data:
  netbox-reports-files:
  netbox-scripts-files:
